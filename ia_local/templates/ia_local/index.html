<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Local — Consultas</title>
<style>
body{font:16px system-ui,sans-serif;background:#f4f6f9;color:#152c3e;margin:0;padding:30px}main{max-width:980px;margin:auto}section{background:white;border:1px solid #dbe1e8;border-radius:10px;padding:22px;margin:18px 0}textarea{box-sizing:border-box;width:100%;min-height:100px;padding:12px;border:1px solid #b8c4ce;border-radius:6px;font:inherit}button{padding:12px 20px;margin-top:12px;border:0;background:#23486b;color:white;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:650px;overflow:auto;background:#f2f5f8;padding:16px;border-radius:6px}.error{color:#a02424}a{color:#205b8b}
</style></head><body><main>
<h1>IA Local — Consultas</h1><p>Motor único Qwen + HOST. <a href="{% url 'ia_local:diagnostico' %}">Diagnóstico</a></p>
<section><form id="formConsulta" action="{% url 'ia_local:consultar' %}" method="post">{% csrf_token %}<label for="pregunta">Pregunta</label><textarea id="pregunta" name="pregunta" required placeholder="¿Cuántos documentos tenemos registrados?"></textarea><button type="submit" id="btnConsultar">Consultar</button></form></section>
<section id="bloqueResultado" hidden><h2>Respuesta</h2><p id="respuesta"></p><p id="estado"></p><h3>JSON completo</h3><pre id="json-completo"></pre><h3>Herramientas y decisiones HOST</h3><pre id="json-diagnostico"></pre></section>
<script>
document.getElementById('formConsulta').addEventListener('submit',async function(ev){
 ev.preventDefault();const panel=document.getElementById('bloqueResultado');panel.hidden=false;
 document.getElementById('respuesta').textContent='Consultando...';
 try{const res=await fetch(this.action,{method:'POST',body:new FormData(this),credentials:'same-origin'});
 const data=await res.json();document.getElementById('respuesta').textContent=data.respuesta||'Sin respuesta';
 document.getElementById('estado').textContent=`Estado: ${data.estado||'—'} | OK: ${data.ok} | Ejecutado: ${data.ejecutado} | Modelo: ${data.modelo||'—'} | Total: ${data.total??'—'}`;
 document.getElementById('json-completo').textContent=JSON.stringify(data,null,2);
 document.getElementById('json-diagnostico').textContent=JSON.stringify(data.diagnostico||{},null,2);
 }catch(err){document.getElementById('respuesta').textContent='Error de comunicación: '+err.message;document.getElementById('json-completo').textContent='';document.getElementById('json-diagnostico').textContent='';}
});
</script></main></body></html>
